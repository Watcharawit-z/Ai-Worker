# ║ ของค่าคอม ที่เหลือคือกำไรคุณ                                       ║
# ║   ค่าคอม 40฿ → จ่ายค่าแอดได้ไม่เกิน 24฿/ออเดอร์                    ║
# ║   ค่าคอม 20฿ → จ่ายค่าแอดได้ไม่เกิน 12฿/ออเดอร์                    ║
# ║   ค่าคอม 10฿ → จ่ายค่าแอดได้ไม่เกิน  6฿/ออเดอร์                    ║
# ║                                                                   ║
# ║ กรอกผิดหรือไม่กรอก = ระบบคิดเพดานผิด แล้วเผาเงินให้คุณ              ║
# ╚═══════════════════════════════════════════════════════════════════╝
