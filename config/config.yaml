# ตั้งค่าแผนกรีรันไลฟ์
# แก้ไฟล์นี้ได้เลย ไม่มีความลับอยู่ในนี้ (API key อยู่ใน .env)

shop:
  name: "ร้านตัวอย่าง"
  channel_id: "channel-01"
  tone: "สุภาพ เป็นกันเอง ลงท้ายด้วยค่ะ ไม่ต้องทางการมาก"
  shipping_note: "ส่งภายใน 1-2 วันทำการ มีเก็บเงินปลายทาง"
  return_policy: "เปลี่ยน/คืนภายใน 7 วัน สินค้าต้องอยู่ในสภาพเดิม"

llm:
  model: "claude-opus-5"
  effort: "medium"       # low = ถูกและเร็ว | medium = สมดุล | high = ฉลาดสุด
  max_tokens: 2000
  enabled: true          # ถ้าไม่มี ANTHROPIC_API_KEY ระบบจะปิดให้เองอัตโนมัติ

comments:
  batch_seconds: 4.0            # รวมคอมเมนท์กี่วินาทีค่อยส่งให้ AI ทีเดียว
  max_batch: 12
  max_replies_per_batch: 4      # ตอบมากกว่านี้ต่อรอบจะดูเป็นบอท
  min_confidence_to_send: 0.6   # ต่ำกว่านี้ไม่ตอบ ส่งต่อให้คน
  cooldown_per_user_seconds: 30 # กันตอบคนเดิมรัว ๆ
  max_reply_chars: 120

compliance:
  check_interval_seconds: 20
  llm_review_interval_seconds: 90   # ให้ AI อ่านบริบทย้อนหลังทุกกี่วินาที
  auto_switch_segment_at: "high"    # เจอระดับนี้ → สลับท่อนวิดีโอทันที
  auto_stop_at: "critical"          # เจอระดับนี้ → หยุดสตรีมและเรียกคน
  banned_words:                     # เติมคำที่ร้านคุณห้ามพูดเอง
    - "ของก๊อป"
    - "เกรดเอ"
  risky_claim_patterns: []          # regex เพิ่มเติม (ถ้าไม่ถนัดปล่อยว่างไว้)

# ตะกร้าเดินตามสิ่งที่คนในคลิปพูด ไม่ได้เดินตามเวลาหรือยอดขาย
baskets:
  pin_check_seconds: 5            # เช็คบ่อยแค่ไหนว่าปักตรงกับที่พูดอยู่ไหม
  pin_lead_seconds: 2             # ปักล่วงหน้ากี่วินาที (กันปักช้ากว่าปาก)
  alert_on_missing_sku: true      # คลิปพูดถึงของที่ไม่มีตะกร้า → เตือนคน

# ไลฟ์นายหน้า: ต้นทุนต่อการซื้อคือตัวชี้ขาด ไม่ใช่ยอดขายรวม
# แอดผูกกับ "ไลฟ์" ไม่ใช่ "ตะกร้า" — เปลี่ยนตะกร้าไม่ต้องแตะแอด
ads:
  enabled: true
  campaign_type: gmv_max_live
  starting_budget: 300            # งบเริ่มต้นต่อไลฟ์ (บาท)
  max_budget: 2000
  scale_step: 1.3

  # เพดานค่าแอดคิดจากค่าคอมใน baskets.yaml ไม่ใช่ตัวเลขตายตัว
  # เพราะค่าคอมแต่ละไลฟ์ไม่เท่ากัน (10-40 บาท) ตั้งตายตัวไม่ได้
  cpa_ceiling_ratio: 0.6          # จ่ายค่าแอดได้ 60% ของค่าคอม ที่เหลือคือกำไร
  cpa_target_ratio: 0.35          # ถูกกว่า 35% ของค่าคอม = คุ้มมาก สเกลได้
  max_cpa_override: 0             # ใส่ตัวเลขถ้าอยากกำหนดเองแทนการคำนวณ
  default_commission: 20          # ใช้เมื่อตะกร้าไม่ได้กรอกค่าคอม

  # เบรกฉุกเฉิน — ขาดทุนสะสมถึงเท่านี้ หยุดยิงแอดทันที ไลฟ์ยังรันต่อ
  max_loss_baht: 500

  min_spend_before_judging: 150
  min_purchases_before_judging: 2
  grace_minutes_after_launch: 20  # แอดเพิ่งขึ้น อย่าเพิ่งตัดสิน
  relaunch_cooldown_minutes: 30   # กันขึ้น-ปิดวนไม่จบ
  max_relaunches_per_live: 3      # เปลี่ยนครบนี่แล้วยังแพง = หยุด รอคน
  check_interval_seconds: 60

# ปริศนายืนยันตัวตน (จิ๊กซอว์) ที่ TikTok เด้งมาตรวจว่ามีคนเฝ้าอยู่
# ระบบ "ตรวจจับและปลุกคน" เท่านั้น ไม่เลื่อนแทน — ดู docs/PLAYBOOK.md
verification:
  enabled: true
  machine_name: "pc-01"           # ตั้งให้ไม่ซ้ำกันทุกเครื่อง
  deadline_seconds: 300           # 5 นาทีตามที่ TikTok ให้
  poll_seconds: 3                 # อ่านจอทุกกี่วินาที
  min_confidence: 0.6
  watcher: mock                   # mock | template (template ต้อง calibrate ก่อน)

stream:
  health_interval_seconds: 5
  stall_alert_after_seconds: 15
  min_bitrate_kbps: 800
  max_dropped_frames: 300
  segment_min_seconds: 120        # เล่นท่อนหนึ่งอย่างน้อยกี่วินาทีก่อนเปลี่ยน
  shuffle_segments: true          # สุ่มลำดับ ทำให้ดูไม่เหมือนวนลูป
  avoid_repeat_within: 3          # ห้ามซ้ำท่อนเดิมภายในกี่ท่อนล่าสุด

adapters:
  comments: mock      # mock | tiktok
  player: mock        # mock | obs
  shop: mock
  ads: mock
  notify: [console]   # console | telegram | webhook (ใส่หลายอันได้)
  options:
    obs:
      host: "localhost"
      port: 4455
      password: ""          # ตั้งใน OBS: Tools → WebSocket Server Settings
      scene: "RERUN"
      media_source: "SEGMENT"
    tiktok:
      unique_id: "@your_account"
    mock_comments:
      rate_per_minute: 40   # จำลองคอมเมนท์เข้ากี่อันต่อนาที
    mock_screen:
      every_seconds: 3600   # จำลองจิ๊กซอว์โผล่ทุกกี่วินาที
      visible_seconds: 300
    screen:                 # ใช้กับ watcher: template
      region: [0, 0, 1920, 1080]
      templates: []         # เก็บด้วย python scripts/calibrate_screen.py
      threshold: 0.82
    telegram: {}            # อ่านจาก TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
    webhook: {}             # อ่านจาก NOTIFY_WEBHOOK_URL

web:
  enabled: true
  host: "127.0.0.1"
  port: 8765

# คุมหลายเครื่อง — ดู docs/FLEET.md
fleet:
  role: standalone        # standalone | worker | hub
  machine_name: "pc-01"
  hub_url: ""             # worker: ที่อยู่ hub เช่น http://192.168.1.50:8700
  hub_host: "0.0.0.0"     # hub: รับจากทุกเครื่องในวง
  hub_port: 8700
  report_seconds: 5
  offline_after_seconds: 30

products_path: "config/knowledge/products.yaml"
baskets_path: "config/baskets.yaml"
segments_path: "config/segments.yaml"
