  - id: seg_sku004_swatch
    path: "media/sku004_swatch.mp4"
    duration_seconds: 480
    sku: SKU-004
    tags: [swatch]

  - id: seg_sku002_demo
    path: "media/sku002_demo.mp4"
    duration_seconds: 540
    sku: SKU-002
    tags: [demo]

  - id: seg_sku006_demo
