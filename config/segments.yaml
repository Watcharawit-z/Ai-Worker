# คลิปที่ใช้รีรัน + คิวชีตบอกว่านาทีไหนพูดถึงสินค้าตัวไหน
#
# คิวชีตคือหัวใจของการปักตะกร้าให้ถูก
# ระบบจะอ่านว่าเล่นมาถึงวินาทีที่เท่าไหร่ แล้วปักตะกร้าตามที่คนในคลิปกำลังพูด
#
# ═══ วิธีทำคิวชีต (ทำครั้งเดียวต่อคลิป) ═══
# 1. เปิดคลิปที่จะรีรัน จดเวลาที่คนไลฟ์เริ่มพูดถึงสินค้าแต่ละตัว
# 2. ใส่ at_seconds (วินาทีนับจากต้นคลิป) กับ sku ให้ตรงกับ baskets.yaml
# 3. ไม่ต้องละเอียดถึงวินาที ±10 วินาทีก็พอ แต่ให้ "ปักก่อนพูด" ดีกว่าปักช้า
#
# เช็คว่าคิวชีตถูกไหม:  python -m aiworker --check

segments:
  # ── แบบที่ 1: คลิปยาวไฟล์เดียวทั้งกะ + คิวชีต (ตรงกับการรีรันจริงมากที่สุด) ──
  - id: full_20250726
    path: "media/live_20250726_full.mp4"
    duration_seconds: 7200          # 2 ชั่วโมง
    weight: 2.0
    tags: [full_show]
    cues:
      - at_seconds: 0
        sku: SKU-001
        note: "เปิดไลฟ์ ทักทาย แล้วเข้าเซรั่มเลย"
      - at_seconds: 900             # 15:00
        sku: SKU-003
        note: "เริ่มรีวิวเซตแต่งหน้า"
      - at_seconds: 2100            # 35:00
        sku: SKU-004
        note: "สวอตช์ลิปทีละเฉด"
      - at_seconds: 3300            # 55:00
        sku: SKU-002
        note: "กันแดด ทาโชว์หน้ากล้อง"
      - at_seconds: 4500            # 75:00
        sku: SKU-006
        note: "มาสก์ราคาถูก ปิดการขายคนลังเล"
      - at_seconds: 5400            # 90:00
        sku: SKU-003
        note: "วนกลับมาเซตแต่งหน้าอีกรอบ"
      - at_seconds: 6600            # 110:00
        sku: SKU-001
        note: "ปิดท้ายด้วยตัวขายดี"

  # ── แบบที่ 2: ตัดเป็นท่อน ท่อนละสินค้า (ไม่ต้องมีคิวชีต ใส่ sku ที่ท่อนเลย) ──
  - id: seg_sku001_demo
    path: "media/sku001_demo.mp4"
    duration_seconds: 600
    sku: SKU-001
    tags: [demo]
    weight: 1.5

  - id: seg_sku003_unbox
    path: "media/sku003_unbox.mp4"
    duration_seconds: 720
    sku: SKU-003
    tags: [unbox]
