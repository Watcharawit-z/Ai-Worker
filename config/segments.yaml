# คลังท่อนวิดีโอสำหรับรีรัน — นี่คือ "ชิ้นจิ๊กซอว์"
#
# วิธีเตรียม: อัดไลฟ์จริงไว้ แล้วตัดเป็นท่อน ๆ ท่อนละ 3-8 นาที
# ท่อนไหนพูดถึงสินค้าตัวไหน ใส่ sku ให้ตรงกัน
# ระบบจะเลือกท่อนที่ตรงกับตะกร้าที่ขึ้นอยู่โดยอัตโนมัติ
#
# sku ว่าง = ท่อนกลาง (ทักทาย/เล่นเกม/ตอบคำถามทั่วไป) ใช้แทรกได้ทุกช่วง
# weight    = ท่อนที่ขายดีตั้งค่าสูงไว้ ระบบจะหยิบบ่อยขึ้น (ค่าปกติ 1.0)
#
# เคล็ดลับกันคนดูจับได้ว่าเป็นรีรัน:
#   1. มีท่อนกลางเยอะ ๆ ไว้แทรกสลับ
#   2. อย่าให้ความยาวรวมต่ำกว่า 2-3 ชั่วโมงต่อกะ
#   3. ตัดให้จบประโยคเสมอ อย่าตัดกลางคำ

