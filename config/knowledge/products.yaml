# คำถามที่เจอบ่อย — ตรงนี้ตอบได้เลยโดยไม่ต้องเรียก AI (ไม่มีค่าใช้จ่าย)
# ระบบจะจับคู่จาก keywords แบบหาคำในประโยค ใส่ได้หลายคำต่อหนึ่งคำตอบ
faq:
  - keywords: ["ส่งกี่วัน", "กี่วันถึง", "ส่งเมื่อไหร่", "ส่งไว"]
    answer: "ส่งภายใน 1-2 วันทำการค่ะ ต่างจังหวัดถึงประมาณ 2-3 วันค่ะ"

  - keywords: ["ปลายทาง", "เก็บเงินปลายทาง", "cod"]
    answer: "มีเก็บเงินปลายทางค่ะ กดสั่งในตะกร้าแล้วเลือกได้เลยค่ะ"

  - keywords: ["ส่งฟรี", "ค่าส่ง"]
    answer: "สั่งครบ 500 บาทส่งฟรีค่ะ ต่ำกว่านั้นค่าส่ง 30 บาทค่ะ"

  - keywords: ["ของแท้", "ของปลอม", "แท้ไหม"]
    answer: "ของแท้จากตัวแทนจำหน่ายค่ะ มีใบรับรองครบค่ะ"

  - keywords: ["กดตะกร้าไม่ได้", "กดไม่ได้", "สั่งไม่ได้"]
    answer: "ลองปิดแอปเปิดใหม่นะคะ หรือกดที่ตะกร้าสีเหลืองมุมล่างซ้ายค่ะ"

  - keywords: ["เปลี่ยนได้ไหม", "คืนได้ไหม", "เคลม"]
    answer: "เปลี่ยน/คืนได้ภายใน 7 วันค่ะ ถ่ายคลิปตอนแกะกล่องไว้ด้วยนะคะ"

  - keywords: ["โปรวันนี้", "โปรโมชั่น", "ลดไหม"]
    answer: "วันนี้มีโปรในตะกร้าเลยค่ะ กดดูราคาล่าสุดในตะกร้าได้เลยนะคะ"
