# โหมดสาธิต — เร่งเวลาทุกอย่างให้เร็วขึ้นสิบเท่า
# ใช้ดูว่าระบบตัดสินใจยังไงภายในไม่กี่นาที แทนที่จะต้องรอทั้งกะ
#
#   python -m aiworker --config config/demo.yaml --minutes 3
#
# อย่าเอาค่าพวกนี้ไปใช้จริง — ตะกร้าจะเปลี่ยนเร็วเกินจนคนดูงง

shop:
  name: "ร้านตัวอย่าง (โหมดสาธิต)"
  channel_id: "demo"
  tone: "สุภาพ เป็นกันเอง ลงท้ายด้วยค่ะ"
  shipping_note: "ส่งภายใน 1-2 วันทำการ มีเก็บเงินปลายทาง"
  return_policy: "เปลี่ยน/คืนภายใน 7 วัน"

llm:
  model: "claude-opus-5"
  effort: "low"
  max_tokens: 1500

comments:
  batch_seconds: 3.0
  max_batch: 8
  max_replies_per_batch: 3
  min_confidence_to_send: 0.6
  cooldown_per_user_seconds: 10
  max_reply_chars: 120

compliance:
  llm_review_interval_seconds: 30
  auto_switch_segment_at: "high"
  auto_stop_at: "critical"
  banned_words: ["ของก๊อป"]

baskets:
  pin_check_seconds: 2
  pin_lead_seconds: 2
  alert_on_missing_sku: true

ads:
  enabled: true
  campaign_type: gmv_max_live
  starting_budget: 300
  max_budget: 2000
  scale_step: 1.3
  max_cpa: 120
  target_cpa: 70
  min_spend_before_judging: 10      # ปกติ 150
  min_purchases_before_judging: 1   # ปกติ 2
  grace_minutes_after_launch: 0.3   # ปกติ 20
  relaunch_cooldown_minutes: 0.5    # ปกติ 30
  max_relaunches_per_live: 3
  check_interval_seconds: 10

verification:
  enabled: true
  machine_name: "demo-pc"
  deadline_seconds: 60            # ปกติ 300 — ย่อให้เห็นการปลุกครบทุกขั้นเร็ว ๆ
  poll_seconds: 2
  watcher: mock

stream:
  health_interval_seconds: 2
  stall_alert_after_seconds: 10
  segment_min_seconds: 60         # ปกติ 120
  shuffle_segments: true
  avoid_repeat_within: 3

adapters:
  comments: mock
  player: mock
  shop: mock
  ads: mock
  notify: [console]
  options:
    mock_comments:
      rate_per_minute: 120        # คอมเมนท์ถล่มเข้ามา ดูว่าระบบรับไหวไหม
    mock_screen:
      every_seconds: 90           # จิ๊กซอว์โผล่ถี่ ๆ จะได้เห็นสายการปลุกคน
      visible_seconds: 25

web:
  enabled: true
  host: "127.0.0.1"
  port: 8765

products_path: "config/knowledge/products.yaml"
baskets_path: "config/baskets.yaml"
segments_path: "config/demo_segments.yaml"
