[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiworker"
version = "0.1.0"
description = "พนักงาน AI สำหรับแผนกรีรันไลฟ์ TikTok"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ai = ["anthropic>=0.69.0"]
obs = ["obsws-python>=1.7.0"]
screen = ["mss>=9.0.0", "pillow>=10.0.0"]
tiktok = ["TikTokLive>=6.0.0"]
browser = ["playwright>=1.44.0"]
notify = ["httpx>=0.27.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
aiworker = "aiworker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiworker = ["web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
